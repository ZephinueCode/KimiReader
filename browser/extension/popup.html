<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #1a1a1a;
    }
    .info {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 8px;
    }
    button:hover {
      background: #333;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    #status {
      font-size: 12px;
      color: #1a1a1a;
      margin-top: 8px;
      min-height: 18px;
    }
    .error {
      color: #d32f2f;
    }
    .success {
      color: #388e3c;
    }
  </style>
</head>
<body>
  <h1>KimiReader</h1>
  <div class="info">
    在当前页面导出 kimi.moonshot.cn 的聊天记录为JSON文件，供Kimi Code CLI读取。
  </div>
  <button id="exportBtn">导出当前聊天记录</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
